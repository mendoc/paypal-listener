<!--
  Extrait du corps HTML d'un mail PayPal « Vous avez envoyé un paiement ».
  Le balisage reproduit fidèlement celui de PayPal pour les blocs que
  services/emailParser.js analyse ; les données personnelles (nom du
  bénéficiaire, identifiant de transaction, référence) ont été remplacées.
-->
<body>
  <td align="center" style="padding:0px 24px 40px 24px;word-break:break-word">
    <p class="ppsans" style="font-size:42px;line-height:46px;font-weight:900;color:#000;margin:0"><span>Vous avez envoyé 38,11 € EUR à Aline Cherubine MBADINGA.</span></p>
  </td>
  <table id="cartDetails" cellSpacing="0" cellPadding="0" border="0" width="100%" dir="ltr" style="font-size:14px">
    <tbody>
      <tr>
        <td style="padding:10px 10px;text-align:left;border-top:0px;width:50%;vertical-align:top"><span><strong>Numéro de transaction</strong></span><br /><a href="https://www.paypal.com/myaccount/activities/details/9AB12345CD6789012?source=p2p_email_get_details"><span>9AB12345CD6789012</span></a></td>
        <td style="padding:10px 10px;text-align:right;border-top:0px;width:50%;vertical-align:top"><span><strong>Date de la transaction</strong></span><br /><span>24 septembre 2026</span></td>
      </tr>
    </tbody>
  </table>
  <table width="100%" dir="ltr" style="font-size:14px;padding:0px 10px">
    <tbody>
      <tr>
        <td><strong>Vous avez payé</strong></td>
        <td align="right">38,11 € EUR</td>
      </tr>
    </tbody>
  </table>
  <table width="100%" dir="ltr" style="font-size:14px;padding:0px 10px">
    <tbody>
      <tr>
        <td width="45%"><strong>Votre message pour Aline Cherubine MBADINGA</strong></td>
        <td align="right" width="55%">GF2639DK4P7WX</td>
      </tr>
    </tbody>
  </table>
</body>
